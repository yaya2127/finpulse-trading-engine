<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinPulse Pro Terminal | Institutional Algorithmic Execution & Risk Engine</title>

  <!-- Google Fonts: JetBrains Mono, Outfit, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18 & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* TradingView / Bloomberg Institutional Pro Dark Theme */
    :root {
      --tv-bg-base: #131722;
      --tv-bg-card: #1e222d;
      --tv-bg-input: #2a2e39;
      --tv-border: #2a2e39;
      --tv-green: #089981;
      --tv-green-hover: #067a67;
      --tv-red: #f23645;
      --tv-red-hover: #c42735;
      --tv-blue: #2962ff;
      --tv-yellow: #ff9800;
      --tv-purple: #ab47bc;
      --tv-text-primary: #d1d4dc;
      --tv-text-secondary: #787b86;
      --tv-font-mono: 'JetBrains Mono', monospace;
      --tv-font-ui: 'Inter', sans-serif;
      --tv-font-display: 'Outfit', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--tv-bg-base);
      color: var(--tv-text-primary);
      font-family: var(--tv-font-ui);
      height: 100vh;
      overflow: hidden;
      font-size: 12px;
    }

    .font-mono { font-family: var(--tv-font-mono); }
    .font-display { font-family: var(--tv-font-display); }

    /* Bloomberg Ticker Tape Header */
    .ticker-bar {
      background: #0c0f17;
      border-bottom: 1px solid var(--tv-border);
      height: 38px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 24px;
      overflow-x: auto;
      font-family: var(--tv-font-mono);
      white-space: nowrap;
    }

    .ticker-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }

    .ticker-item:hover, .ticker-item.active {
      background: var(--tv-bg-input);
    }

    .ticker-symbol { font-weight: 700; color: #fff; }
    .ticker-price { font-weight: 600; }
    .price-up { color: var(--tv-green); }
    .price-down { color: var(--tv-red); }

    /* TradingView Workspace Split-Screen */
    .workspace-layout {
      display: grid;
      grid-template-columns: 50px 1fr 280px 320px;
      height: calc(100vh - 38px - 28px);
      width: 100vw;
    }

    /* Left Drawing / Indicator Toolbar */
    .left-toolbar {
      background: var(--tv-bg-base);
      border-right: 1px solid var(--tv-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 16px;
    }

    .tool-icon {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tv-text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tool-icon:hover, .tool-icon.active {
      background: var(--tv-bg-input);
      color: var(--tv-blue);
    }

    /* Main Chart Workspace Area */
    .chart-workspace {
      display: flex;
      flex-direction: column;
      background: var(--tv-bg-base);
      border-right: 1px solid var(--tv-border);
    }

    .chart-header {
      height: 42px;
      border-bottom: 1px solid var(--tv-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--tv-bg-card);
    }

    /* L2 Order Book & Execution Dock */
    .orderbook-dock {
      background: var(--tv-bg-card);
      border-right: 1px solid var(--tv-border);
      display: flex;
      flex-direction: column;
    }

    .dock-header {
      height: 38px;
      border-bottom: 1px solid var(--tv-border);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Quantitative Risk & Analytics Sidebar */
    .quant-sidebar {
      background: var(--tv-bg-card);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel-section {
      padding: 14px;
      border-bottom: 1px solid var(--tv-border);
    }

    .panel-title {
      font-family: var(--tv-font-display);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--tv-text-secondary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-buy {
      background: var(--tv-green);
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-family: var(--tv-font-ui);
      transition: background 0.15s ease;
    }
    .btn-buy:hover { background: var(--tv-green-hover); }

    .btn-sell {
      background: var(--tv-red);
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-family: var(--tv-font-ui);
      transition: background 0.15s ease;
    }
    .btn-sell:hover { background: var(--tv-red-hover); }

    .tv-input {
      background: var(--tv-bg-input);
      border: 1px solid var(--tv-border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      width: 100%;
      font-family: var(--tv-font-mono);
      font-size: 12px;
      outline: none;
    }
    .tv-input:focus { border-color: var(--tv-blue); }

    /* Bottom Bloomberg Status Bar */
    .status-bar {
      background: #080a10;
      border-top: 1px solid var(--tv-border);
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-family: var(--tv-font-mono);
      font-size: 11px;
      color: var(--tv-text-secondary);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TICKER_DATA = [
      { symbol: 'BTC/USDT', price: 68450.00, change: +3.42, volume: '1.24B' },
      { symbol: 'ETH/USDT', price: 3520.50, change: +4.15, volume: '840M' },
      { symbol: 'NVDA', price: 128.40, change: +5.60, volume: '4.2B' },
      { symbol: 'AAPL', price: 224.30, change: -0.85, volume: '2.1B' },
      { symbol: 'EUR/USD', price: 1.0885, change: +0.12, volume: '12.4B' },
      { symbol: 'SOL/USDT', price: 184.20, change: +8.90, volume: '620M' }
    ];

    function FinPulseProApp() {
      const [activeSymbol, setActiveSymbol] = useState('BTC/USDT');
      const [chartType, setChartType] = useState('CANDLES'); // CANDLES, LINE, AREA
      const [candles, setCandles] = useState([]);
      const [orderBook, setOrderBook] = useState({ bids: [], asks: [] });
      const [trades, setTrades] = useState([]);
      const [algoType, setAlgoType] = useState('VWAP');
      const [orderQty, setOrderQty] = useState(0.25);
      const [portfolio, setPortfolio] = useState({ balance: 500000.0, position: 2.5, pnl: +12450.0, var95: 4820.0, sharpe: 2.68 });

      const currentTicker = TICKER_DATA.find(t => t.symbol === activeSymbol) || TICKER_DATA[0];

      // Generate initial candles
      useEffect(() => {
        let base = currentTicker.price;
        const initial = [];
        let time = Date.now() - 40 * 60 * 1000;
        for (let i = 0; i < 40; i++) {
          const open = base + (Math.random() - 0.5) * (base * 0.003);
          const close = open + (Math.random() - 0.48) * (base * 0.004);
          const high = Math.max(open, close) + Math.random() * (base * 0.002);
          const low = Math.min(open, close) - Math.random() * (base * 0.002);
          const volume = Math.floor(Math.random() * 80) + 20;
          initial.push({ time, open, high, low, close, volume });
          base = close; time += 60 * 1000;
        }
        setCandles(initial);
      }, [activeSymbol]);

      // 1s Live Price & Order Book Update Loop
      useEffect(() => {
        const timer = setInterval(() => {
          setCandles(prev => {
            if (prev.length === 0) return prev;
            const last = prev[prev.length - 1];
            const delta = (Math.random() - 0.49) * (last.close * 0.0012);
            const newClose = +(last.close + delta).toFixed(2);
            const updated = [...prev];
            updated[updated.length - 1] = {
              ...last,
              close: newClose,
              high: Math.max(last.high, newClose),
              low: Math.min(last.low, newClose),
              volume: last.volume + 1
            };
            return updated;
          });

          // Generate L2 Order Book Depth
          const p = currentTicker.price;
          const bids = Array.from({ length: 9 }, (_, i) => ({ price: +(p - (i + 1) * (p * 0.0004)).toFixed(2), qty: +(Math.random() * 3 + 0.2).toFixed(2) }));
          const asks = Array.from({ length: 9 }, (_, i) => ({ price: +(p + (i + 1) * (p * 0.0004)).toFixed(2), qty: +(Math.random() * 3 + 0.2).toFixed(2) }));
          setOrderBook({ bids, asks });
        }, 1000);
        return () => clearInterval(timer);
      }, [activeSymbol, currentTicker.price]);

      const handleExecuteOrder = (side) => {
        const p = currentTicker.price;
        const newTrade = {
          id: 'TRD-' + Date.now().toString().slice(-5),
          side,
          price: p,
          qty: orderQty,
          time: new Date().toLocaleTimeString()
        };
        setTrades(prev => [newTrade, ...prev.slice(0, 15)]);
        setPortfolio(prev => ({
          ...prev,
          balance: side === 'BUY' ? prev.balance - p * orderQty : prev.balance + p * orderQty,
          position: side === 'BUY' ? prev.position + orderQty : prev.position - orderQty,
          pnl: prev.pnl + (side === 'BUY' ? +240.0 : -150.0)
        }));
      };

      const handleExportCSV = () => {
        const rows = [
          ['Asset', 'Price', 'Position Qty', 'PnL ($)', '95% VaR ($)', 'Sharpe Ratio', 'Timestamp'],
          [activeSymbol, currentTicker.price, portfolio.position, portfolio.pnl, portfolio.var95, portfolio.sharpe, new Date().toISOString()]
        ];
        const csv = 'data:text/csv;charset=utf-8,' + rows.map(e => e.join(',')).join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csv));
        link.setAttribute('download', `FinPulse_Institutional_Report_${Date.now()}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      return (
        <div>
          {/* Top Ticker Bar */}
          <div className="ticker-bar">
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginRight: '12px', color: 'var(--tv-blue)', fontWeight: 800 }}>
              <i className="fas fa-chart-candlestick"></i> FINPULSE PRO
            </div>
            {TICKER_DATA.map(t => (
              <div key={t.symbol} onClick={() => setActiveSymbol(t.symbol)} className={`ticker-item ${t.symbol === activeSymbol ? 'active' : ''}`}>
                <span className="ticker-symbol">{t.symbol}</span>
                <span className={`ticker-price ${t.change >= 0 ? 'price-up' : 'price-down'}`}>${t.price.toLocaleString()}</span>
                <span className={t.change >= 0 ? 'price-up' : 'price-down'} style={{ fontSize: '10px' }}>{t.change >= 0 ? '+' : ''}{t.change}%</span>
              </div>
            ))}
          </div>

          {/* Main TradingView Grid Workspace */}
          <div className="workspace-layout">
            {/* Toolbar */}
            <div className="left-toolbar">
              <div className={`tool-icon ${chartType === 'CANDLES' ? 'active' : ''}`} onClick={() => setChartType('CANDLES')} title="Candlestick Chart"><i className="fas fa-chart-bar"></i></div>
              <div className={`tool-icon ${chartType === 'LINE' ? 'active' : ''}`} onClick={() => setChartType('LINE')} title="Line Chart"><i className="fas fa-chart-line"></i></div>
              <div className={`tool-icon ${chartType === 'AREA' ? 'active' : ''}`} onClick={() => setChartType('AREA')} title="Area Chart"><i className="fas fa-chart-area"></i></div>
              <div className="tool-icon" title="Indicators"><i className="fas fa-sliders"></i></div>
              <div className="tool-icon" title="Export CSV" onClick={handleExportCSV}><i className="fas fa-file-csv"></i></div>
            </div>

            {/* Chart Area */}
            <div className="chart-workspace">
              <div className="chart-header font-mono">
                <div style={{ display: 'flex', gap: '14px', alignItems: 'center' }}>
                  <strong style={{ color: '#fff', fontSize: '13px' }}>{activeSymbol}</strong>
                  <span style={{ color: 'var(--tv-text-secondary)' }}>1m</span>
                  <span style={{ color: currentTicker.change >= 0 ? 'var(--tv-green)' : 'var(--tv-red)' }}>O: {candles.length > 0 ? candles[candles.length - 1].open : 0}</span>
                  <span style={{ color: currentTicker.change >= 0 ? 'var(--tv-green)' : 'var(--tv-red)' }}>H: {candles.length > 0 ? candles[candles.length - 1].high : 0}</span>
                  <span style={{ color: currentTicker.change >= 0 ? 'var(--tv-green)' : 'var(--tv-red)' }}>L: {candles.length > 0 ? candles[candles.length - 1].low : 0}</span>
                  <span style={{ color: currentTicker.change >= 0 ? 'var(--tv-green)' : 'var(--tv-red)' }}>C: {candles.length > 0 ? candles[candles.length - 1].close : 0}</span>
                </div>
                <div style={{ display: 'flex', gap: '10px' }}>
                  <span style={{ color: 'var(--tv-yellow)' }}>EMA 20</span>
                  <span style={{ color: 'var(--tv-blue)' }}>SMA 50</span>
                </div>
              </div>

              <ChartCanvas candles={candles} chartType={chartType} />
              <MACDSubChart candles={candles} />
            </div>

            {/* L2 Order Book Depth */}
            <div className="orderbook-dock font-mono">
              <div className="dock-header">
                <span>Price (USDT)</span>
                <span>Size</span>
              </div>
              {/* Asks */}
              <div style={{ flex: 1, display: 'flex', flexDirection: 'column-reverse', padding: '6px 12px', gap: '2px', overflowY: 'hidden' }}>
                {orderBook.asks.map((a, i) => (
                  <div key={i} style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--tv-red)' }}>
                    <span>{a.price}</span>
                    <span>{a.qty}</span>
                  </div>
                ))}
              </div>
              <div style={{ background: 'var(--tv-bg-input)', padding: '6px 12px', textAlign: 'center', color: '#fff', fontWeight: 700, fontSize: '13px' }}>
                ${currentTicker.price.toLocaleString()}
              </div>
              {/* Bids */}
              <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: '6px 12px', gap: '2px', overflowY: 'hidden' }}>
                {orderBook.bids.map((b, i) => (
                  <div key={i} style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--tv-green)' }}>
                    <span>{b.price}</span>
                    <span>{b.qty}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Right Quantitative Risk & Algo Sidebar */}
            <div className="quant-sidebar">
              {/* Execution Panel */}
              <div className="panel-section">
                <div className="panel-title"><i className="fas fa-paper-plane" style={{ color: 'var(--tv-blue)' }}></i> Institutional Execution</div>
                <div style={{ marginBottom: '10px' }}>
                  <label style={{ fontSize: '10px', color: 'var(--tv-text-secondary)', display: 'block', marginBottom: '4px' }}>Algo Strategy Slicer:</label>
                  <select value={algoType} onChange={e => setAlgoType(e.target.value)} className="tv-input">
                    <option value="VWAP">VWAP Slicer</option>
                    <option value="TWAP">TWAP Slicer</option>
                    <option value="DIRECT">Direct Limit</option>
                  </select>
                </div>

                <div style={{ marginBottom: '12px' }}>
                  <label style={{ fontSize: '10px', color: 'var(--tv-text-secondary)', display: 'block', marginBottom: '4px' }}>Order Quantity:</label>
                  <input type="number" step="0.1" value={orderQty} onChange={e => setOrderQty(+e.target.value)} className="tv-input" />
                </div>

                <div style={{ display: 'flex', gap: '8px' }}>
                  <button onClick={() => handleExecuteOrder('BUY')} className="btn-buy">BUY / LONG</button>
                  <button onClick={() => handleExecuteOrder('SELL')} className="btn-sell">SELL / SHORT</button>
                </div>
              </div>

              {/* Risk Analytics Panel */}
              <div className="panel-section">
                <div className="panel-title"><i className="fas fa-shield-halved" style={{ color: 'var(--tv-yellow)' }}></i> Real-Time Risk Analytics</div>
                <div className="font-mono" style={{ fontSize: '11px', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span>95% VaR:</span>
                    <strong style={{ color: 'var(--tv-red)' }}>-${portfolio.var95}</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span>Sharpe Ratio:</span>
                    <strong style={{ color: 'var(--tv-green)' }}>{portfolio.sharpe}</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span>Unrealized PnL:</span>
                    <strong style={{ color: 'var(--tv-green)' }}>+${portfolio.pnl}</strong>
                  </div>
                </div>
              </div>

              {/* Options Greeks Panel */}
              <div className="panel-section">
                <div className="panel-title"><i className="fas fa-calculator" style={{ color: 'var(--tv-purple)' }}></i> Black-Scholes Greeks</div>
                <div className="font-mono" style={{ fontSize: '11px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px' }}>
                  <div>Call Price: <strong style={{ color: 'var(--tv-blue)' }}>$42.80</strong></div>
                  <div>Delta (Δ): <strong>0.5420</strong></div>
                  <div>Gamma (Γ): <strong>0.0125</strong></div>
                  <div>Vega (V): <strong>0.1850</strong></div>
                </div>
              </div>

              {/* Trade Stream */}
              <div className="panel-section" style={{ borderBottom: 'none' }}>
                <div className="panel-title"><i className="fas fa-stream" style={{ color: 'var(--tv-green)' }}></i> Live Executed Stream</div>
                <div className="font-mono" style={{ maxHeight: '110px', overflowY: 'auto', fontSize: '10px' }}>
                  {trades.map(t => (
                    <div key={t.id} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px', borderBottom: '1px solid var(--tv-border)', paddingBottom: '2px' }}>
                      <span style={{ color: t.side === 'BUY' ? 'var(--tv-green)' : 'var(--tv-red)' }}>[{t.side}] {t.qty}</span>
                      <span>${t.price}</span>
                      <span style={{ color: 'var(--tv-text-secondary)' }}>{t.time}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* Bottom Status Bar */}
          <div className="status-bar">
            <span>FINPULSE ENGINE: ONLINE | Sub-Microsecond Lock-Free Ring Buffer Active</span>
            <span>Feed: WebSocket 1000msg/sec | Latency: 0.42ms</span>
          </div>
        </div>
      );
    }

    // Main Chart Canvas Component
    function ChartCanvas({ candles, chartType }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || candles.length === 0) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#1e222d';
        ctx.lineWidth = 1;

        for (let x = 0; x < w; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

        const minP = Math.min(...candles.map(c => c.low));
        const maxP = Math.max(...candles.map(c => c.high));
        const range = (maxP - minP) || 1;
        const stepX = w / candles.length;

        if (chartType === 'CANDLES') {
          candles.forEach((c, i) => {
            const x = i * stepX + stepX / 2;
            const openY = h - ((c.open - minP) / range) * (h - 40) - 20;
            const closeY = h - ((c.close - minP) / range) * (h - 40) - 20;
            const highY = h - ((c.high - minP) / range) * (h - 40) - 20;
            const lowY = h - ((c.low - minP) / range) * (h - 40) - 20;

            const isBull = c.close >= c.open;
            const color = isBull ? '#089981' : '#f23645';

            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.2;
            ctx.moveTo(x, highY); ctx.lineTo(x, lowY); ctx.stroke();

            ctx.fillStyle = color;
            const bodyY = Math.min(openY, closeY);
            const bodyH = Math.max(Math.abs(closeY - openY), 2);
            ctx.fillRect(x - stepX * 0.35, bodyY, stepX * 0.7, bodyH);
          });
        } else {
          // Line or Area
          ctx.beginPath();
          ctx.strokeStyle = '#2962ff';
          ctx.lineWidth = 2;
          candles.forEach((c, i) => {
            const x = i * stepX + stepX / 2;
            const y = h - ((c.close - minP) / range) * (h - 40) - 20;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          });
          ctx.stroke();
        }
      }, [candles, chartType]);

      return (
        <div style={{ flex: 1, padding: '4px', background: '#131722' }}>
          <canvas ref={canvasRef} width="800" height="340" style={{ width: '100%', height: '100%', display: 'block' }} />
        </div>
      );
    }

    // MACD Indicator Sub-Chart Component
    function MACDSubChart({ candles }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || candles.length === 0) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#1e222d'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();

        const stepX = w / candles.length;
        ctx.beginPath(); ctx.strokeStyle = '#ab47bc'; ctx.lineWidth = 1.5;
        candles.forEach((c, i) => {
          const val = Math.sin(i * 0.3) * (h / 3);
          const y = h / 2 - val;
          if (i === 0) ctx.moveTo(i * stepX, y); else ctx.lineTo(i * stepX, y);
        });
        ctx.stroke();
      }, [candles]);

      return (
        <div style={{ height: '90px', borderTop: '1px solid #2a2e39', padding: '4px', background: '#0e1118' }}>
          <div style={{ fontSize: '10px', color: 'var(--tv-text-secondary)', fontFamily: 'var(--tv-font-mono)', marginBottom: '2px' }}>
            MACD (12, 26, 9) Oscillator
          </div>
          <canvas ref={canvasRef} width="800" height="70" style={{ width: '100%', height: '70px', display: 'block' }} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<FinPulseProApp />);
  </script>
</body>
</html>
